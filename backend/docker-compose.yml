version: '3.8'

services:
  # 1. MySQL 8 Database Container
  db:
    image: mysql:8.0
    container_name: disista-mysql-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: disaster2026_root_secure
      MYSQL_DATABASE: disista_control
      MYSQL_USER: disista_user
      MYSQL_PASSWORD: disista_secure_pass_2026
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "disista_user", "-pdisista_secure_pass_2026"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Fastify Production API Container
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: disista-backend-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: mysql://disista_user:disista_secure_pass_2026@db:3306/disista_control
      JWT_ACCESS_SECRET: disista_jwt_access_super_secret_production_key_2026_x9k2m
      JWT_REFRESH_SECRET: disista_jwt_refresh_super_secret_production_key_2026_p4v7z
      CORS_ORIGINS: http://localhost:3000,http://localhost:5500,https://shrey-1802.github.io
      TOMTOM_API_KEY: ${TOMTOM_API_KEY:-mock_tomtom_key_for_dev_mode}
    ports:
      - "3000:3000"

volumes:
  mysql_data:
    driver: local
